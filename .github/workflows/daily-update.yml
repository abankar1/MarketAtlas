name: Daily market data update

# One run after every US trading day: Tuesday–Saturday early morning UTC
# picks up the Monday–Friday closes, so each weekday's close is in the app
# before the next workday begins. Symbols are fetched 100 per Marketstack
# request, so a run costs about 6 requests (~130/month).
#
# GitHub cron runs in UTC and DOES NOT honor DST; the schedule may drift
# by an hour twice a year. Acceptable for an early-morning batch.
#
# `workflow_dispatch` lets you trigger an ad-hoc run from the Actions tab.
on:
  schedule:
    - cron: "0 9 * * 2-6"  # Tue–Sat 09:00 UTC = 1 AM PST / 2 AM PDT
  workflow_dispatch:

# Avoid stacking two runs if a previous one is still going (e.g. retries).
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    name: Fetch latest daily bars
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Map repo-level secrets to the env-var names settings.py expects.
      # See src/config/settings.py — the env-var path activates whenever
      # DB_URL is set.
      DB_URL: ${{ secrets.DB_URL }}
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MARKETAUX_TOKEN: ${{ secrets.MARKETAUX_TOKEN }}
      # Defaults mirror src/config/settings.py.
      DAYS: "1000"
      API_SLEEP_SECONDS: "0.2"
      ANTHROPIC_MODEL: "claude-haiku-4-5"
      # PYTHONUNBUFFERED=1 keeps print() output flushing in real time so
      # logs appear immediately in the GHA console.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        run: python -m src.main
